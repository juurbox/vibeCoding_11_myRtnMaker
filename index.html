<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FitSequence | 운동 계획 & 인터벌 타이머</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-idle">
  <div class="app-wrapper">
    <!-- Top Bar -->
    <header class="app-topbar">
      <div class="brand">
        <span class="brand-bolt">⚡</span>
        <span class="brand-name">FitSequence</span>
      </div>
      <div class="top-actions">
        <button id="btn-open-storage" class="top-btn" title="루틴 저장 / 불러오기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          <span>루틴 보관함</span>
        </button>
      </div>
    </header>

    <div class="dashboard-grid">
      <!-- LEFT/TOP: Live Main Display -->
      <section class="display-panel">
        <!-- Next Preview Header -->
        <div class="next-banner">
          <span class="next-pill">NEXT</span>
          <span id="next-stage-name" class="next-title">준비 운동 ➔ 다음 운동</span>
        </div>

        <!-- Current Stage & State -->
        <div class="stage-status-box">
          <div class="stage-tag" id="current-stage-tag">STAGE 1 / 3</div>
          <h2 class="stage-name-display" id="current-stage-title">버피 테스트</h2>
          <div class="phase-badge-wrap">
            <span class="phase-badge" id="current-phase-pill">대기 (IDLE)</span>
          </div>
        </div>

        <!-- Huge Main Timer -->
        <div class="huge-timer-container">
          <div class="huge-timer" id="timer-display">00:00</div>
          <div class="timer-progress-track">
            <div class="timer-progress-bar" id="timer-progress-bar"></div>
          </div>
        </div>

        <!-- Info Cards: Rounds & Total Progress -->
        <div class="info-metric-row">
          <div class="metric-card">
            <span class="metric-label">현재 라운드</span>
            <span class="metric-value" id="round-display">1 / 3</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">전체 진행률</span>
            <span class="metric-value" id="overall-progress-text">0%</span>
          </div>
        </div>

        <!-- 4 Essential Control Buttons: 시작, 일시정지, 다음, 초기화 -->
        <div class="main-controller-row">
          <button id="btn-start" class="ctrl-btn btn-start" title="루틴 시작">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <span>시작</span>
          </button>
          <button id="btn-pause" class="ctrl-btn btn-pause" title="일시정지" disabled>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            <span>일시정지</span>
          </button>
          <button id="btn-next" class="ctrl-btn btn-next" title="다음 단계/라운드로 즉시 전환">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"></line></svg>
            <span>다음</span>
          </button>
          <button id="btn-reset" class="ctrl-btn btn-reset" title="처음으로 초기화">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
            <span>초기화</span>
          </button>
        </div>
      </section>

      <!-- RIGHT/BOTTOM: Routine Stage Builder & Configuration -->
      <section class="routine-panel">
        <div class="panel-header">
          <div class="panel-title-area">
            <h3>운동 루틴 구성</h3>
            <p>단계별 운동 이름, 타입, 시간, 라운드를 설정하세요</p>
          </div>
          <!-- Global Prep Time Input -->
          <div class="prep-time-chip">
            <label for="input-prep-time">시작 전 대기</label>
            <input type="number" id="input-prep-time" min="0" max="60" value="5">
            <span>초</span>
          </div>
        </div>

        <!-- Dynamic Stage Cards List -->
        <div class="stage-items-container" id="stage-items-container">
          <!-- Rendered dynamically by JavaScript -->
        </div>

        <!-- Add Stage Button -->
        <button id="btn-add-stage" class="btn-add-stage">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>새 단계 추가하기</span>
        </button>
      </section>
    </div>

    <!-- Storage Modal (Saved Routines) -->
    <div class="modal-backdrop hidden" id="storage-modal">
      <div class="modal-content">
        <div class="modal-top">
          <h3>루틴 보관함</h3>
          <button id="btn-close-modal" class="modal-close">&times;</button>
        </div>

        <!-- Save Form -->
        <div class="save-box">
          <input type="text" id="input-routine-name" placeholder="현재 루틴 이름 (예: 모닝 타바타)">
          <button id="btn-save-routine" class="btn-save">현재 루틴 저장</button>
        </div>

        <!-- List -->
        <div class="storage-list-wrap">
          <h4>저장된 프리셋 & 커스텀 루틴</h4>
          <div class="saved-list" id="saved-list-box">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
